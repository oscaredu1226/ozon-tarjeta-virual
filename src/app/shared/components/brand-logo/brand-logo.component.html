@if (available()) {
  <img
    class="ozon-logo"
    [src]="source()"
    alt="OZON · Terapia del Dolor"
    width="952"
    height="264"
    fetchpriority="high"
    (error)="markUnavailable()"
  />
} @else {
  <div class="brand-fallback" aria-label="OZON · Terapia del Dolor">
    <strong>OZON</strong><span>TERAPIA DEL DOLOR</span>
  </div>
}
