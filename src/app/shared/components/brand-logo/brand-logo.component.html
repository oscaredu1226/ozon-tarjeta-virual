@if (available()) {
  <div class="ozon-logo" role="img" aria-label="OZON · Terapia del Dolor">
    <span class="ozon-symbol"
      ><img [src]="source()" alt="" width="1500" height="1500" (error)="markUnavailable()"
    /></span>
    <span class="ozon-wordmark"
      ><img [src]="source()" alt="" width="1500" height="1500" (error)="markUnavailable()"
    /></span>
  </div>
} @else {
  <div class="brand-fallback" aria-label="OZON · Terapia del Dolor">
    <strong>OZON</strong><span>TERAPIA DEL DOLOR</span>
  </div>
}
